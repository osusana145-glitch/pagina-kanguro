<!-- Kangoo Xpress - Master Layout -->
<app-header></app-header>

<main class="page-body-container" id="main-content">
  <router-outlet></router-outlet>
</main>

<!-- Footer and WhatsApp button never block the first paint of the quoter -->
@defer (on viewport) {
  <app-footer></app-footer>
} @placeholder {
  <div class="footer-placeholder" aria-hidden="true"></div>
}

@defer (on idle) {
  <app-whatsapp-button></app-whatsapp-button>
}
